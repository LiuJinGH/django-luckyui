<div class="lucky-cascader-{{ widget.name }}" style="display: inline !important;">
    {% include "luckyui/forms/widgets/none_textarea.html" %}

    <el-cascader :value="input_value"
                 size="small"
                 :options="options"
                 :show-all-levels="false"
                 :props="{ checkStrictly: true }"
                 @change="change_value"
                ></el-cascader>
</div>

<script type="text/javascript">
    new Vue({
        el: '.lucky-cascader-{{ widget.name }}',
        data() {
            return {
                input_value: 0,
                options: []
            }
        },
        mounted() {
            this.field_id = 'id_' + "{{ widget.name }}"
            console.log('field_id:', this.field_id)
            this.input_value = document.getElementById(this.field_id).value
            this.input_value = parseInt(this.input_value)
            console.log('input_value:', this.input_value)

            let cascader_options = '{{ widget.cascader_options|safe }}'
            console.log('cascader_options:', cascader_options)
            this.options = JSON.parse(cascader_options)
        },
        methods: {
            change_value(value) {
                console.log('change_value:')
                console.log(value)
                if(value && value.length > 0) {
                    document.getElementById(this.field_id).value = value[value.length - 1]
                }else {
                    document.getElementById(this.field_id).value = ''
                }
            }
        }
    })
</script>
